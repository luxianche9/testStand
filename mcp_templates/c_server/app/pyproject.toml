[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge-c-server-template"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2", "pydantic>=2,<3", "testforge-mcp-runtime==0.1.0", "uvicorn>=0.30,<1"]

[project.scripts]
testforge-c-server = "testforge_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

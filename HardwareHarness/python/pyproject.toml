[project]
name = "hardwareharness-backend"
version = "0.1.0"
description = "Python backend for the HardwareHarness desktop"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==1.29.1",
  "paramiko==5.0.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "anyio==4.15.1",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "ada-url==1.15.3",
  "ruamel.yaml==0.18.15",
  "keyring==25.7.0",
  "hardwareharness-device-sdk",
  "hh-adapter-pci1710l",
  "hh-adapter-pci1762",
  "hh-adapter-pci6208v",
  "hh-adapter-cp118u-i",
]

[project.entry-points."hardwareharness.test_steps"]

[project.entry-points."hardwareharness.result_listeners"]

[tool.uv.sources]
hardwareharness-device-sdk = { path = "../../mcp_servers/sdk", editable = true }
hh-adapter-pci1710l = { path = "../../mcp_servers/adapters/pci1710l", editable = true }
hh-adapter-pci1762 = { path = "../../mcp_servers/adapters/pci1762", editable = true }
hh-adapter-pci6208v = { path = "../../mcp_servers/adapters/pci6208v", editable = true }
hh-adapter-cp118u-i = { path = "../../mcp_servers/adapters/cp118u_i", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardwareharness_backend"]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "types-paramiko",
  "types-jsonschema",
  "pyinstaller==6.22.2",
  "import-linter==2.15",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["hardwareharness_backend"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["ts_case(name): original TypeScript specification case"]

[tool.coverage.run]
branch = true
source = ["hardwareharness_backend"]

[tool.coverage.report]
show_missing = true


# Layering of the workstation service (design doc §9.2): imports only go downward.
[tool.importlinter]
root_package = "hardwareharness_backend"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Access layer (HTTP, MCP gateway) is not imported from below"
type = "forbidden"
source_modules = [
  "hardwareharness_backend.application",
  "hardwareharness_backend.devices",
  "hardwareharness_backend.projects",
  "hardwareharness_backend.wiring",
  "hardwareharness_backend.testing",
  "hardwareharness_backend.streams",
  "hardwareharness_backend.storage",
  "hardwareharness_backend.contracts",
]
forbidden_modules = [
  "hardwareharness_backend.host",
  "hardwareharness_backend.mcp_gateway",
]

[[tool.importlinter.contracts]]
name = "Domain layer does no I/O: no application or resource imports"
type = "forbidden"
source_modules = [
  "hardwareharness_backend.testing.compiler",
  "hardwareharness_backend.testing.interpreter",
  "hardwareharness_backend.testing.expression",
  "hardwareharness_backend.testing.models",
  "hardwareharness_backend.streams.judge",
]
forbidden_modules = [
  "hardwareharness_backend.application",
  "hardwareharness_backend.devices",
  "hardwareharness_backend.projects",
  "hardwareharness_backend.wiring",
  "hardwareharness_backend.storage",
  "hardwareharness_backend.testing.application",
  "hardwareharness_backend.testing.engine",
  "hardwareharness_backend.testing.journal",
  "hardwareharness_backend.testing.run_io",
  "hardwareharness_backend.testing.runtime_state",
  "hardwareharness_backend.testing.store",
  "hardwareharness_backend.streams.source",
  "hardwareharness_backend.streams.clock",
  "hardwareharness_backend.streams.recorder",
  "hardwareharness_backend.streams.live",
  "hardwareharness_backend.streams.store",
]

[[tool.importlinter.contracts]]
name = "Resource layer has no business dependencies"
type = "forbidden"
source_modules = [
  "hardwareharness_backend.devices.mcp_client",
  "hardwareharness_backend.devices.ssh",
  "hardwareharness_backend.streams.source",
  "hardwareharness_backend.streams.clock",
  "hardwareharness_backend.streams.recorder",
  "hardwareharness_backend.storage",
]
forbidden_modules = [
  "hardwareharness_backend.application",
  "hardwareharness_backend.projects",
  "hardwareharness_backend.wiring",
  "hardwareharness_backend.testing",
  "hardwareharness_backend.streams.judge",
]

[[tool.importlinter.contracts]]
name = "Contracts depend on nothing else in the service"
type = "forbidden"
source_modules = ["hardwareharness_backend.contracts"]
forbidden_modules = [
  "hardwareharness_backend.application",
  "hardwareharness_backend.devices",
  "hardwareharness_backend.projects",
  "hardwareharness_backend.wiring",
  "hardwareharness_backend.testing",
  "hardwareharness_backend.streams",
  "hardwareharness_backend.storage",
]

[project]
name = "hardwareharness-backend"
version = "0.1.0"
description = "Behavior-compatible Python backend for the HardwareHarness desktop"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==1.29.1",
  "paramiko==5.0.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "anyio==4.15.1",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "ada-url==1.15.3",
  "ruamel.yaml==0.18.15",
]

[project.entry-points."hardwareharness.test_steps"]

[project.entry-points."hardwareharness.result_listeners"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardwareharness_backend"]

[dependency-groups]
dev = [
  "ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov",
  "types-paramiko", "types-jsonschema", "pyinstaller==6.22.2",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["hardwareharness_backend"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["ts_case(name): original TypeScript specification case"]

[tool.coverage.run]
branch = true
source = ["hardwareharness_backend"]

[tool.coverage.report]
show_missing = true


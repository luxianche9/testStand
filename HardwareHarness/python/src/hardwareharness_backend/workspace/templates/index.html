<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HardwareHarness 应用</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui,sans-serif; }
  body { max-width: 880px; margin: 24px auto; padding: 0 20px; }
  input,button { font: inherit; padding: 7px 12px; border: 1px solid #8886; border-radius: 10px; }
  button { cursor: pointer; } button:disabled { cursor: default; opacity: .5; }
  form { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #8886; border-radius: 10px;
        min-height: 180px; padding: 16px; max-height: 60vh; overflow: auto; }
  #status { min-height: 20px; }
</style>
<h1>HardwareHarness 应用</h1>
<p>每次运行生成独立执行记录。此模板使用模拟数据，可替换为已登记的主动硬件调用。</p>
<form id="form">
  <label>采样次数 <input name="samples" type="number" min="1" max="100" value="3" required></label>
  <button id="run" type="submit">运行</button>
  <button id="cancel" type="button" disabled>取消</button>
</form>
<p id="status" role="status">就绪</p>
<pre id="output" aria-label="运行日志"></pre>
<script>
const form = document.querySelector('#form');
const run = document.querySelector('#run');
const cancel = document.querySelector('#cancel');
const status = document.querySelector('#status');
const output = document.querySelector('#output');
let runId;
let events;
async function request(url, options = {}) {
  const response = await fetch(url, options);
  const result = await response.json();
  if (!response.ok) throw new Error(result.message || result.error || response.statusText);
  return result;
}
function finish() { run.disabled = false; cancel.disabled = true; events?.close(); }
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  run.disabled = true;
  output.textContent = '';
  status.textContent = '正在启动';
  try {
    const result = await request('/__hardwareharness/actions/sample', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({samples: Number(new FormData(form).get('samples'))})
    });
    runId = result.runId;
    status.textContent = `运行 ${runId}`;
    cancel.disabled = false;
    events = new EventSource(`/__hardwareharness/runs/${encodeURIComponent(runId)}/events`);
    events.onmessage = (event) => {
      output.textContent += JSON.stringify(JSON.parse(event.data), null, 2) + '\n';
      output.scrollTop = output.scrollHeight;
    };
    events.addEventListener('complete', async () => {
      finish();
      const detail = await request(`/__hardwareharness/runs/${encodeURIComponent(runId)}`);
      status.textContent = detail.run.status;
    });
    events.onerror = () => { status.textContent = '正在重新连接日志'; };
  } catch (error) { status.textContent = error.message; finish(); }
});
cancel.addEventListener('click', async () => {
  cancel.disabled = true;
  try {
    await request(`/__hardwareharness/runs/${encodeURIComponent(runId)}/cancel`, {method: 'POST'});
    status.textContent = '已请求取消';
  } catch (error) { status.textContent = error.message; cancel.disabled = false; }
});
</script>
</html>

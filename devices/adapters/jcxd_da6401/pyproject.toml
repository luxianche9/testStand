[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teststand-adapter-jcxd-da6401"
version = "1.0.0"
description = "testStand device plugin for the Devices-JC JCXD-DA-CPCI-6401"
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk>=0.2,<0.3"]

[project.entry-points."teststand.devices"]
jcxd_da6401 = "teststand_adapter_jcxd_da6401:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teststand_adapter_jcxd_da6401 = ["py.typed", "bin/*.dll"]

# Read by devices/pack.py into the .tsdev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.teststand.package]
vendorDrivers = ["Devices-JC DA6401_JC kernel driver"]
requiredFiles = ["bin/DA6401_JC.dll"]

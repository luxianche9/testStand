[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teststand-adapter-comm-link"
version = "1.0.0"
description = "testStand device plugin: a link over the PC's COM port, TCP or UDP"
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk>=0.2,<0.3"]

[project.entry-points."teststand.devices"]
comm_link = "teststand_adapter_comm_link:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teststand_adapter_comm_link = ["py.typed"]

# Read by devices/pack.py into the .tsdev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.teststand.package]
vendorDrivers = []
requiredFiles = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teststand-adapter-pci6208v"
version = "0.2.0"
description = "testStand MCP adapter for the ADLINK PCI-6208V 8-channel analog output card"
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk>=0.2,<0.3"]

[project.entry-points."teststand.devices"]
pci6208v = "teststand_adapter_pci6208v:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teststand_adapter_pci6208v = ["py.typed"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teststand-adapter-htlt-lvdt8"
version = "1.0.0"
description = "testStand device plugin for the HTLT PXI68802W-I"
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk>=0.2,<0.3"]

[project.entry-points."teststand.devices"]
htlt_lvdt8 = "teststand_adapter_htlt_lvdt8:DEVICE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teststand_adapter_htlt_lvdt8 = ["py.typed", "bin/*.dll"]

# Read by devices/pack.py into the .tsdev manifest: vendor drivers the bench must have installed,
# and package files that must be in the wheel (e.g. "bin/<bridge>.exe").
[tool.teststand.package]
vendorDrivers = ["HTLT 2.x LVDT simulator board driver"]
requiredFiles = ["bin/htlt_api_x64.dll"]

[project]
name = "teststand-devices"
version = "0"
description = "Workspace root for the testStand device SDK and hardware adapters."
requires-python = ">=3.11"
dependencies = ["teststand-device-sdk", "teststand-adapter-pci6208v", "teststand-adapter-pci1710l", "teststand-adapter-pci1762", "teststand-adapter-cp118u-i", "teststand-adapter-jcxd-da6401", "teststand-adapter-jcxd-mads3210"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "adapters/*"]

[tool.uv.sources]
teststand-device-sdk = { workspace = true }
teststand-adapter-pci6208v = { workspace = true }
teststand-adapter-pci1710l = { workspace = true }
teststand-adapter-pci1762 = { workspace = true }
teststand-adapter-cp118u-i = { workspace = true }
teststand-adapter-jcxd-da6401 = { workspace = true }
teststand-adapter-jcxd-mads3210 = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

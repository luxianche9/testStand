[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teststand-device-sdk"
version = "0.2.0"
description = "SDK for testStand device plugins: tools, streams, lifecycle and the compliance suite."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teststand_device_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

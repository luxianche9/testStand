[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-adapter-pci6208v"
version = "0.2.0"
description = "HardwareHarness MCP adapter for the ADLINK PCI-6208V 8-channel analog output card"
requires-python = ">=3.11"
dependencies = ["hardwareharness-device-sdk>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hh_adapter_pci6208v = ["py.typed", "assets/*.svg", "assets/**/*.svg"]

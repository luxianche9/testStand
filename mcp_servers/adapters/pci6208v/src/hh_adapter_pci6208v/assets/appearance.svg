<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Consolas, Menlo, monospace" role="img" aria-label="ADLINK PCI-6208V  analog output card">
<title>ADLINK PCI-6208V  analog output card</title>
<rect width="560" height="300" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="14" text-anchor="start" font-weight="bold" fill="#212529">ADLINK PCI-6208V  analog output card</text>
<rect x="70" y="44" width="470" height="188" rx="6" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/>
<rect x="220" y="232" width="230" height="16" fill="#f0c36d" stroke="#b08900" stroke-width="1"/>
<text x="335.0" y="262.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#495057">bus edge connector</text>
<rect x="40" y="30" width="16" height="222" fill="#ced4da" stroke="#495057" stroke-width="1.2"/>
<text x="48.0" y="266.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#495057">bracket</text>
<rect x="36" y="58.0" width="24" height="160.0" rx="3" fill="#495057" stroke="#212529" stroke-width="1"/>
<text x="78.0" y="141.0" font-size="10" text-anchor="start" font-weight="bold" fill="#212529">CN1  37-pin D-sub</text>
<text x="240.0" y="72.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">8 x static AO, +/-10 V (V0..V7)</text>
<text x="240.0" y="90.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">4 x DI, 4 x DO (TTL) on CN1</text>
<text x="240.0" y="108.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">no FIFO, no hardware clock</text>
<text x="240.0" y="126.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">no output readback (setpoints only)</text>
<text x="16.0" y="286.0" font-size="9" text-anchor="start" font-weight="normal" fill="#495057">Schematic outline, not a photograph; proportions approximate.</text>
</svg>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-adapter-cp118u-i"
version = "0.2.0"
description = "HardwareHarness MCP adapter for the Moxa CP-118U-I 8-port serial card"
requires-python = ">=3.11"
dependencies = ["hardwareharness-device-sdk>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Consolas, Menlo, monospace" role="img" aria-label="Moxa CP-118U-I  8-port isolated serial card">
<title>Moxa CP-118U-I  8-port isolated serial card</title>
<rect width="560" height="300" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="14" text-anchor="start" font-weight="bold" fill="#212529">Moxa CP-118U-I  8-port isolated serial card</text>
<rect x="70" y="44" width="470" height="188" rx="6" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="2"/>
<rect x="220" y="232" width="230" height="16" fill="#f0c36d" stroke="#b08900" stroke-width="1"/>
<text x="335.0" y="262.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#495057">bus edge connector</text>
<rect x="40" y="30" width="16" height="222" fill="#ced4da" stroke="#495057" stroke-width="1.2"/>
<text x="48.0" y="266.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#495057">bracket</text>
<rect x="36" y="58.0" width="24" height="160.0" rx="3" fill="#495057" stroke="#212529" stroke-width="1"/>
<text x="78.0" y="141.0" font-size="10" text-anchor="start" font-weight="bold" fill="#212529">multiport connector</text>
<text x="240.0" y="72.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">8 x isolated serial port (P1..P8)</text>
<text x="240.0" y="90.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">RS-232 / RS-422 / RS-485 per port</text>
<text x="240.0" y="108.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">mode set by DIP switch, not software</text>
<text x="240.0" y="126.0" font-size="10" text-anchor="start" font-weight="normal" fill="#212529">fan-out cable to 8 x DB9 male</text>
<text x="16.0" y="286.0" font-size="9" text-anchor="start" font-weight="normal" fill="#495057">Schematic outline, not a photograph; proportions approximate.</text>
</svg>

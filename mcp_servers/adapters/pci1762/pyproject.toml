[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-adapter-pci1762"
version = "0.2.0"
description = "HardwareHarness MCP adapter for the Advantech PCI-1762 relay card (16 relays, 16 isolated DI)"
requires-python = ">=3.11"
dependencies = ["hardwareharness-device-sdk>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hh_adapter_pci1762 = ["py.typed"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwareharness-device-sdk"
version = "0.2.0"
description = "SDK for HardwareHarness single-device MCP servers: tools, streams, leases and lifecycle."
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardwareharness_device_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwareharness-firedap"
version = "0.1.0"
description = "Local FireDAP CMSIS-DAP programmer for the Embedfire STM32F407ZG board"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.30,<2", "pyocd>=0.45,<0.46", "intelhex>=2.3", "pyelftools>=0.33", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
hardwareharness-firedap = "hardwareharness_firedap.server:main"

[tool.setuptools.packages.find]
where = ["src"]

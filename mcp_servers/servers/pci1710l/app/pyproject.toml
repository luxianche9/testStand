[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardwareharness-remote"
version = "0.1.0"
description = "Unified HardwareHarness remote MCP server for the first hardware bench"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
hardwareharness-remote = "hardwareharness_remote.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

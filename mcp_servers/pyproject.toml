[project]
name = "hardwareharness-mcp-servers"
version = "0"
description = "Workspace root for the HardwareHarness device SDK and hardware adapters."
requires-python = ">=3.11"
dependencies = ["hardwareharness-device-sdk", "hh-adapter-pci6208v", "hh-adapter-pci1710l", "hh-adapter-pci1762", "hh-adapter-cp118u-i"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "adapters/*"]

[tool.uv.sources]
hardwareharness-device-sdk = { workspace = true }
hh-adapter-pci6208v = { workspace = true }
hh-adapter-pci1710l = { workspace = true }
hh-adapter-pci1762 = { workspace = true }
hh-adapter-cp118u-i = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
